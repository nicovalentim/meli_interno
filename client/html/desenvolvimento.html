<html>
    <meta charset="UTF-8">
    <head>
        <link rel="icon" type="image/icon" href="../rsc/icones/favicon.ico" />
        <title>Portal Mercado Livre</title>

        <link rel="stylesheet" href="../css/global.css" />
        <link rel="stylesheet" href="../css/desenvolvimento.css" />
    </head>

    <body>
        <nav></nav>
        <header
            data-img="desenvolvimento"
            data-cor="envios"
        >
            <h1>
                Seu futuro também é agora
            </h1>
            <p>
                Explore trilhas, cursos e ferramentas para aprimorar suas habilidades e crescer com a gente.
            </p>
        </header>

        <hr />

        <main>

            <canvas class="grafico"
                data-grafico1="vagas"
                data-grafico2="areas"
                data-tipo="rosca"
                style="width: 100%; height: 320px;"></canvas>

            <canvas class="grafico"
                data-grafico1="vagas"
                data-grafico2="regime"
                data-tipo="pizza"
                style="width: 100%; height: 320px;"></canvas>

            <canvas class="grafico"
                data-grafico1="vagas"
                data-grafico2="localizacao"
                data-tipo="barra"
                data-rotacao="45"
                style="width: 100%; height: 320px;"></canvas>

            <canvas class="grafico"
                data-grafico1="vagas"
                data-grafico2="salario"
                data-tipo="linha"
                data-rotacao="45"
                style="width: 100%; height: 320px;"></canvas>

        </main>

        <footer></footer>

    </body>

    <script src="../js/global.js" type="module"></script>
    <script src="../js/desenvolvimento.js" type="module"></script>

</html>
