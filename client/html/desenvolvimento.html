<html>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <head>
        <link rel="icon" type="image/icon" href="../rsc/icones/favicon.ico" />
        <title>Portal Mercado Livre</title>
        
        <link rel="stylesheet" href="../css/global.css" />
        <link rel="stylesheet" href="../css/desenvolvimento.css" />
    </head>

    <body>
        <nav></nav>
        <header
            data-img="desenvolvimento"
            data-cor="envios"
        >
            <h1>
                Seu futuro também é agora
            </h1>
            <p>
                Explore trilhas, cursos e ferramentas para aprimorar suas habilidades e crescer com a gente.
            </p>
        </header>

        <main class="desenvolvimento">

            <section class="ultimo">
                <h1>
                    Seu progresso
                </h1>
                <canvas class="grafico" id="graficoProgresso"></canvas>
                <div>
                    <p class="titulo" id="destaqueTitulo"></p>
                    <p id="destaqueProgresso"></p>
                    <button id="destaqueBotao" hidden>Continuar</button>
                </div>
            </section>

            <section class="proximos">
                <h2>
                    Próximos passos
                </h2>
                <ul id="proximosPassos"></ul>
            </section>

            <div>
                <h2>
                    Trilhas de aprendizado
                </h2>
                <a>
                    Ver todos →
                </a>
            </div>

        </main>

        <footer></footer>

    </body>

    <script src="../js/global.js" type="module"></script>
    <script src="../js/desenvolvimento.js" type="module"></script>

</html>
