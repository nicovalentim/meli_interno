<html>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <head>
        <link rel="icon" type="image/icon" href="../rsc/icones/favicon.ico" />
        <title>Portal Mercado Livre</title>

        <link rel="stylesheet" href="../css/global.css" />
        <link rel="stylesheet" href="../css/administrativo.css" />
    </head>

    <body>
        <nav></nav>
        <header
            data-img="administrativo"
            data-cor="shops"
        >
            <h1>
                Título temporário
            </h1>
            <p>
                Falta texto para essa página
            </p>
        </header>

        <hr />

        <main class="administrativo">

            <section>
                <h2>Eventos por status</h2>
                <canvas class="grafico"
                    data-grafico1="eventos"
                    data-grafico2="status"
                    data-tipo="rosca"></canvas>
            </section>

            <section>
                <h2>Eventos por parceiro</h2>
                <canvas class="grafico"
                    data-grafico1="eventos"
                    data-grafico2="parceiro"
                    data-tipo="pizza"></canvas>
            </section>

            <section>
                <h2>Cobertura por região</h2>
                <canvas class="grafico"
                    data-grafico1="cobertura"
                    data-grafico2="regiao"
                    data-tipo="barra"
                    data-rotacao="45"></canvas>
            </section>

            <section>
                <h2>Eventos por mês</h2>
                <canvas class="grafico"
                    data-grafico1="eventos"
                    data-grafico2="mes"
                    data-tipo="linha"
                    data-rotacao="45"></canvas>
            </section>

        </main>

        <footer></footer>

    </body>

    <script src="../js/global.js" type="module"></script>
    <script src="../js/administrativo.js" type="module"></script>

</html>
